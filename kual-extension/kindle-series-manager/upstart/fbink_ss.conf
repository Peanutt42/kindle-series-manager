description "FBink ScreenSaver Enable on Boot"

start on framework_ready and started lab126_gui
stop on stopping system

export LANG=en_US.UTF-8

script
    LOG="/mnt/us/fbink_ss-upstart.log"
    EXT_DIR="/mnt/us/extensions/kindle-series-manager"
    TOGGLE_SCRIPT="$EXT_DIR/bin/fbink_ss_toggle.sh"
    FLAG_FILE="/mnt/us/ENABLE_FBINK_SS_ON_BOOT"

    echo "$(date) fbink_ss starting" >> "$LOG"

    if [ ! -f "$FLAG_FILE" ]; then
        echo "$(date) FLAG_FILE missing, exiting" >> "$LOG"
        exit 0
    fi

    if [ ! -f "$TOGGLE_SCRIPT" ]; then
        echo "$(date) TOGGLE_SCRIPT missing, exiting" >> "$LOG"
        exit 0
    fi

    echo "$(date) launching fbink_ss_toggle.sh enable" >> "$LOG"
    $TOGGLE_SCRIPT enable >> "$LOG" 2>&1
end script
